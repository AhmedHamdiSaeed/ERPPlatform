# ============================================================
#  ERPPlatform – Docker Compose
#  Run:  docker compose up --build
#  Stop: docker compose down
#  Reset DB: docker compose down -v
# ============================================================

services:
  # ── SQL Server Database ──────────────────────────────────
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: erpplatform-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "ERPPlatform_Dev123!"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "ERPPlatform_Dev123!" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── .NET 9 Backend API ───────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: erpplatform-backend
    ports:
      - "8080:8080"
    environment:
      # Override connection string to point to the 'db' container
      ConnectionStrings__Default: "Server=db;Database=ERPPlatform;User Id=sa;Password=ERPPlatform_Dev123!;TrustServerCertificate=True;Encrypt=False"
      # App URLs for CORS and OpenIddict
      App__SelfUrl: "http://localhost:8080"
      App__ClientUrl: "http://localhost:4200"
      App__CorsOrigins: "http://localhost:4200"
      App__RedirectAllowedUrls: "http://localhost:4200"
      AuthServer__Authority: "http://localhost:8080"
      AuthServer__RequireHttpsMetadata: "false"
      ASPNETCORE_ENVIRONMENT: "Development"
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

  # ── Angular 20 Frontend ─────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.angular
    container_name: erpplatform-frontend
    ports:
      - "4200:80"
    depends_on:
      - backend
    restart: on-failure

volumes:
  sqlserver-data:
    driver: local
