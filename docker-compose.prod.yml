# ============================================================
#  ERPPlatform – Docker Compose (Production)
#  Uses the remote production database instead of local SQL Server container.
#
#  1. Copy .env.example to .env and fill in your production credentials
#  2. Run:  docker compose -f docker-compose.yml -f docker-compose.prod.yml up --build
#  3. Stop: docker compose -f docker-compose.yml -f docker-compose.prod.yml down
# ============================================================

services:
  # ── Remove the local SQL Server container ────────────────
  db:
    profiles:
      - disabled

  # ── Override backend to use production database ──────────
  backend:
    env_file:
      - .env
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
    depends_on: []
