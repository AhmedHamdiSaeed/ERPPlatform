<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ERP Platform — Enterprise Resource Planning Suite</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Enterprise-grade ERP Platform with HR, Inventory, Workflow Engine, AI Assistant and more." />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    
    <!-- Google Fonts (Optional font enhancements) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  </head>
  <body>
    <app-root>
      <div style="display:flex;align-items:center;justify-content:center;height:100vh;font-family:Inter,system-ui,sans-serif;color:#64748b;">
        <div style="text-align:center;">
          <div style="width:48px;height:48px;border:4px solid #e2e8f0;border-top-color:#2563eb;border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 16px;"></div>
          <p id="initial-loading-text" style="font-size:14px;font-weight:600;">Loading...</p>
        </div>
      </div>
      <script>
        (function() {
          try {
            var lang = localStorage.getItem('erp_lang');
            var isAr = lang === 'ar' || (!lang && (navigator.language || '').toLowerCase().startsWith('ar'));
            var textEl = document.getElementById('initial-loading-text');
            if (isAr) {
              if (textEl) textEl.textContent = 'جارٍ التحميل...';
              document.documentElement.setAttribute('dir', 'rtl');
              document.documentElement.setAttribute('lang', 'ar');
            } else {
              if (textEl) textEl.textContent = 'Loading...';
              document.documentElement.setAttribute('dir', 'ltr');
              document.documentElement.setAttribute('lang', 'en');
            }
          } catch (e) {}
        })();
      </script>
      <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
    </app-root>
  </body>
</html>
