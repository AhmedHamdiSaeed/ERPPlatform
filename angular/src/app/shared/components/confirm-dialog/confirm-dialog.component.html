@if (dialogService.activeDialog(); as active) {
  <div 
    class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-xs animate-fade-in"
    (click)="dialogService.handleCancel()">
    
    <div 
      class="w-full max-w-md bg-[var(--bg-card)] border border-[var(--border-color)] rounded-2xl shadow-2xl overflow-hidden p-6 space-y-5 animate-scale-in"
      (click)="$event.stopPropagation()">
      
      <!-- Icon Header -->
      <div class="flex items-start gap-4">
        <div 
          class="w-12 h-12 rounded-2xl flex items-center justify-center text-xl shrink-0 shadow-sm"
          [class.bg-rose-100]="active.options.type === 'danger'" [class.text-rose-600]="active.options.type === 'danger'"
          [class.bg-amber-100]="active.options.type === 'warning'" [class.text-amber-600]="active.options.type === 'warning'"
          [class.bg-emerald-100]="active.options.type === 'success'" [class.text-emerald-600]="active.options.type === 'success'"
          [class.bg-blue-100]="active.options.type === 'info'" [class.text-blue-600]="active.options.type === 'info'">
          <i [class]="'pi ' + (active.options.icon || getIcon(active.options.type))"></i>
        </div>

        <div class="flex-1 min-w-0">
          <h3 class="font-extrabold text-base text-[var(--text-main)] leading-tight">{{ active.options.title | translate }}</h3>
          <p class="text-xs text-[var(--text-muted)] mt-1.5 leading-relaxed leading-normal">{{ active.options.message | translate }}</p>
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="pt-4 border-t border-[var(--border-color)] flex items-center justify-end gap-3">
        <button 
          (click)="dialogService.handleCancel()"
          class="px-4 py-2 text-xs font-semibold rounded-xl border border-[var(--border-color)] text-[var(--text-main)] hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">
          {{ active.options.cancelText | translate }}
        </button>

        <button 
          (click)="dialogService.handleConfirm()"
          [class.bg-rose-600]="active.options.type === 'danger'" [class.hover:bg-rose-700]="active.options.type === 'danger'"
          [class.bg-amber-600]="active.options.type === 'warning'" [class.hover:bg-amber-700]="active.options.type === 'warning'"
          [class.bg-emerald-600]="active.options.type === 'success'" [class.hover:bg-emerald-700]="active.options.type === 'success'"
          [class.bg-blue-600]="active.options.type === 'info'" [class.hover:bg-blue-700]="active.options.type === 'info'"
          class="px-4 py-2 text-xs font-bold text-white rounded-xl shadow-md transition-colors flex items-center gap-2">
          <span>{{ active.options.confirmText | translate }}</span>
        </button>
      </div>

    </div>
  </div>
}
