@if (backendStatus.isOffline() || isStandalone()) {
  <div class="fixed inset-0 z-[99999] flex items-center justify-center bg-slate-900/60 backdrop-blur-xs p-4 overflow-y-auto animate-fade-in"
       [dir]="state.isRtl() ? 'rtl' : 'ltr'">
    
    <div class="relative w-full max-w-md bg-white dark:bg-slate-900 rounded-2xl shadow-2xl border border-slate-200 dark:border-slate-800 overflow-hidden my-8 p-6 text-center">
      
      <!-- Icon with pulse -->
      <div class="mx-auto w-16 h-16 rounded-2xl bg-amber-50 dark:bg-amber-950/50 border border-amber-200 dark:border-amber-800/60 flex items-center justify-center text-amber-600 dark:text-amber-400 mb-4">
        <svg class="w-8 h-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                d="M18.364 5.636a9 9 0 010 12.728m0 0l-2.829-2.829m2.829 2.829L21 21M15.536 8.464a5 5 0 010 7.072m0 0l-2.829-2.829m-4.243 4.243a9 9 0 01-12.728 0m0 0l2.829-2.829m-2.829 2.829L3 21m2.829-12.728a9 9 0 0112.728 0M8.464 15.536a5 5 0 010-7.072m0 0l2.829 2.829" />
        </svg>
      </div>

      <h2 class="text-lg sm:text-xl font-bold text-slate-900 dark:text-white">
        {{ state.isRtl() ? 'تعذر الاتصال بالخادم' : 'Connection Problem' }}
      </h2>

      <p class="text-xs sm:text-sm text-slate-500 dark:text-slate-400 mt-2 leading-relaxed">
        {{ state.isRtl() 
          ? 'يرجى التحقق من اتصالك بالإنترنت والمحاولة مجدداً.' 
          : 'Please check your internet connection and try again.' }}
      </p>

      <!-- Action Buttons -->
      <div class="mt-6 flex flex-col sm:flex-row items-center justify-center gap-3">
        <!-- Retry Button -->
        <button type="button" 
                (click)="onRetry()"
                [disabled]="backendStatus.isChecking()"
                class="w-full sm:w-auto px-5 py-2.5 rounded-xl font-bold text-xs text-white bg-blue-600 hover:bg-blue-700 active:bg-blue-800 disabled:opacity-60 transition-all shadow-md shadow-blue-500/20 flex items-center justify-center gap-2 cursor-pointer">
          @if (backendStatus.isChecking()) {
            <svg class="animate-spin h-3.5 w-3.5 text-white" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <span>{{ state.isRtl() ? 'جاري الفحص...' : 'Checking...' }}</span>
          } @else {
            <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                    d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
            </svg>
            <span>{{ state.isRtl() ? 'إعادة المحاولة' : 'Retry' }}</span>
          }
        </button>

        <!-- Dismiss / Demo Mode Button -->
        <button type="button" 
                (click)="onDismiss()"
                class="w-full sm:w-auto px-4 py-2.5 rounded-xl text-xs font-semibold text-slate-700 dark:text-slate-200 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors cursor-pointer">
          <span>{{ state.isRtl() ? 'المتابعة' : 'Dismiss' }}</span>
        </button>
      </div>

    </div>
  </div>
}
