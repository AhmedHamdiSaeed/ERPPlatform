<div class="flex h-dvh overflow-hidden bg-[var(--bg-main)]" [attr.dir]="state.isRtl() ? 'rtl' : 'ltr'">
  
  <!-- Mobile Sidebar Backdrop -->
  @if (state.sidebarExpanded()) {
    <div 
      class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-30 md:hidden transition-opacity"
      (click)="state.toggleSidebar()">
    </div>
  }

  <!-- Sidebar (Full height from top to bottom) -->
  <app-sidebar />

  <!-- Main Content Area -->
  <div class="flex-1 flex flex-col min-w-0 overflow-hidden transition-all">
    
    <!-- Top Header Bar -->
    <app-header />
    
    <!-- Scrollable Content Region -->
    <main class="flex-1 overflow-y-auto p-3 sm:p-5 lg:p-8">
      <router-outlet />
    </main>
  </div>

</div>

<!-- Global Overlays -->
<app-global-search-modal />
<app-ai-widget />
<app-pwa-prompt />

<!-- Shared Toast & Confirm Dialog Overlay -->
<app-toast-container />
<app-confirm-dialog />
<app-file-import-dialog />
