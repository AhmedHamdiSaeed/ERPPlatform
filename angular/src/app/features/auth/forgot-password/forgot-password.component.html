<div class="min-h-screen bg-slate-900 flex items-center justify-center p-4">
  <div class="w-full max-w-md bg-white dark:bg-slate-800 rounded-2xl shadow-2xl p-8 border border-slate-700/50 animate-fade-in">
    <div class="text-center mb-8">
      <div class="w-12 h-12 rounded-2xl bg-blue-600 text-white flex items-center justify-center text-2xl font-bold mx-auto mb-3 shadow-lg shadow-blue-500/30">
        <i class="pi pi-key"></i>
      </div>
      <h2 class="text-2xl font-extrabold text-slate-900 dark:text-white tracking-tight">Forgot Password</h2>
      <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">Enter your registered email to receive a password reset link.</p>
    </div>

    @if (sent()) {
      <div class="p-4 bg-emerald-50 text-emerald-800 rounded-xl border border-emerald-200 text-xs space-y-2 mb-6">
        <div class="flex items-center gap-2 font-bold text-sm text-emerald-700">
          <i class="pi pi-check-circle text-lg"></i>
          <span>Reset Instructions Sent!</span>
        </div>
        <p>If an account exists for <span class="font-semibold">{{ email() }}</span>, you will receive a reset link shortly.</p>
      </div>
      <a routerLink="/auth/login" class="w-full py-3 bg-blue-600 text-white font-bold text-xs rounded-xl shadow-md block text-center hover:bg-blue-700 transition-colors">
        Return to Sign In
      </a>
    } @else {
      <form (ngSubmit)="onSubmit()" class="space-y-4">
        @if (errorMsg()) {
          <div class="p-3 bg-red-50 text-red-700 text-xs rounded-xl border border-red-200 flex items-center gap-2">
            <i class="pi pi-exclamation-triangle"></i>
            <span>{{ errorMsg() }}</span>
          </div>
        }

        <div>
          <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">Email Address</label>
          <input 
            type="email" 
            [(ngModel)]="email" 
            name="email"
            required
            placeholder="admin@erpplatform.com"
            class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-slate-900 text-xs text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500"
          />
        </div>

        <button 
          type="submit" 
          [disabled]="loading() || !email()"
          class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs rounded-xl shadow-lg shadow-blue-500/25 transition-all flex items-center justify-center gap-2 disabled:opacity-50">
          @if (loading()) {
            <i class="pi pi-spin pi-spinner text-sm"></i>
          }
          <span>{{ loading() ? 'Sending Email...' : 'Send Reset Link' }}</span>
        </button>

        <div class="text-center pt-2">
          <a routerLink="/auth/login" class="text-xs text-blue-600 hover:underline flex items-center justify-center gap-1">
            <i class="pi pi-arrow-left text-[10px]"></i> Back to Sign In
          </a>
        </div>
      </form>
    }
  </div>
</div>
