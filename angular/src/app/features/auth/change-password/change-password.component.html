<div class="max-w-md mx-auto space-y-6 animate-fade-in pb-8">
  <div class="flex items-center gap-3">
    <a routerLink="/settings" class="p-2 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-600 hover:text-slate-900 transition-colors">
      <i class="pi pi-arrow-left text-xs"></i>
    </a>
    <div>
      <h1 class="text-xl font-extrabold text-[var(--text-main)] tracking-tight">Change Password</h1>
      <p class="text-xs text-[var(--text-muted)] mt-0.5">Update your account credentials securely.</p>
    </div>
  </div>

  <div class="card-panel p-6 space-y-4">
    @if (success()) {
      <div class="p-4 bg-emerald-50 border border-emerald-200 text-emerald-800 rounded-xl text-xs flex items-center gap-3">
        <i class="pi pi-check-circle text-xl text-emerald-600"></i>
        <div>
          <p class="font-bold">Password Updated Successfully!</p>
          <p class="text-[11px] text-emerald-700">Your account security settings have been updated.</p>
        </div>
      </div>
    }

    @if (errorMsg()) {
      <div class="p-3 bg-red-50 text-red-700 text-xs rounded-xl border border-red-200 flex items-center gap-2">
        <i class="pi pi-exclamation-triangle"></i>
        <span>{{ errorMsg() }}</span>
      </div>
    }

    <form (ngSubmit)="onSubmit()" class="space-y-4 text-xs">
      <div>
        <label class="block font-bold text-[var(--text-main)] mb-1">Current Password</label>
        <input 
          type="password" 
          [(ngModel)]="currentPassword" 
          name="currentPassword"
          required
          placeholder="••••••••"
          class="w-full px-3.5 py-2.5 rounded-xl border border-[var(--border-color)] bg-[var(--bg-main)] text-[var(--text-main)] focus:outline-none focus:ring-2 focus:ring-blue-500"
        />
      </div>

      <div>
        <label class="block font-bold text-[var(--text-main)] mb-1">New Password</label>
        <input 
          type="password" 
          [(ngModel)]="newPassword" 
          name="newPassword"
          required
          placeholder="••••••••"
          class="w-full px-3.5 py-2.5 rounded-xl border border-[var(--border-color)] bg-[var(--bg-main)] text-[var(--text-main)] focus:outline-none focus:ring-2 focus:ring-blue-500"
        />
      </div>

      <div>
        <label class="block font-bold text-[var(--text-main)] mb-1">Confirm New Password</label>
        <input 
          type="password" 
          [(ngModel)]="confirmPassword" 
          name="confirmPassword"
          required
          placeholder="••••••••"
          class="w-full px-3.5 py-2.5 rounded-xl border border-[var(--border-color)] bg-[var(--bg-main)] text-[var(--text-main)] focus:outline-none focus:ring-2 focus:ring-blue-500"
        />
      </div>

      <button 
        type="submit" 
        [disabled]="loading() || !currentPassword() || !newPassword() || !confirmPassword()"
        class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs rounded-xl shadow-md transition-all flex items-center justify-center gap-2 disabled:opacity-50">
        @if (loading()) {
          <i class="pi pi-spin pi-spinner text-sm"></i>
        }
        <span>{{ loading() ? 'Updating Password...' : 'Save New Password' }}</span>
      </button>
    </form>
  </div>
</div>
