<div class="min-h-screen bg-slate-900 flex items-center justify-center p-4">
  <div class="w-full max-w-md bg-white dark:bg-slate-800 rounded-2xl shadow-2xl p-8 border border-slate-700/50 animate-fade-in">
    <div class="text-center mb-8">
      <div class="w-12 h-12 rounded-2xl bg-indigo-600 text-white flex items-center justify-center text-2xl font-bold mx-auto mb-3 shadow-lg shadow-indigo-500/30">
        <i class="pi pi-lock"></i>
      </div>
      <h2 class="text-2xl font-extrabold text-slate-900 dark:text-white tracking-tight">Set New Password</h2>
      <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">Please enter your new password below.</p>
    </div>

    @if (success()) {
      <div class="p-4 bg-emerald-50 text-emerald-800 rounded-xl border border-emerald-200 text-xs space-y-2 text-center">
        <i class="pi pi-check-circle text-2xl text-emerald-600 block"></i>
        <p class="font-bold text-sm">Password Successfully Reset!</p>
        <p>Redirecting you to login page...</p>
      </div>
    } @else {
      <form (ngSubmit)="onSubmit()" class="space-y-4">
        @if (errorMsg()) {
          <div class="p-3 bg-red-50 text-red-700 text-xs rounded-xl border border-red-200 flex items-center gap-2">
            <i class="pi pi-exclamation-triangle"></i>
            <span>{{ errorMsg() }}</span>
          </div>
        }

        <div>
          <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">New Password</label>
          <input 
            type="password" 
            [(ngModel)]="newPassword" 
            name="newPassword"
            required
            placeholder="••••••••"
            class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-slate-900 text-xs text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500"
          />
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">Confirm New Password</label>
          <input 
            type="password" 
            [(ngModel)]="confirmPassword" 
            name="confirmPassword"
            required
            placeholder="••••••••"
            class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-slate-900 text-xs text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500"
          />
        </div>

        <button 
          type="submit" 
          [disabled]="loading() || !newPassword() || !confirmPassword()"
          class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs rounded-xl shadow-lg shadow-blue-500/25 transition-all flex items-center justify-center gap-2 disabled:opacity-50">
          @if (loading()) {
            <i class="pi pi-spin pi-spinner text-sm"></i>
          }
          <span>{{ loading() ? 'Updating Password...' : 'Reset Password' }}</span>
        </button>
      </form>
    }
  </div>
</div>
